[workspace]
resolver = "3"
members = ["crates/elysium-core", "app/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Keep debug builds small: line tables for our code, no debug info for dependencies.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

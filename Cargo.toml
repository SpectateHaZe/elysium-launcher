[workspace]
resolver = "3"
members = ["crates/elysium-core", "crates/elysium-app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/elysium-launcher/elysium-launcher"
rust-version = "1.95"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
